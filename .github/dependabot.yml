version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "pyright"
          - "ruff"
          - "types-*"
    ignore:
      # mcp 2.x renamed FastMCP to MCPServer and changed other APIs.
      # "update-types: semver-major" alone does not block range-widening
      # updates (e.g. "<2.0" -> "<3.0"), so pin the version explicitly too.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
        versions: [">=2.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
