version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "pyright"
          - "ruff"
          - "types-*"
    ignore:
      # mcp 2.x renamed FastMCP to MCPServer and changed other APIs;
      # avoid automatic major-version bumps until the code is migrated.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
